# Hand-written until infra-config generates this repo's presubmit (V0-CFG-02).
# Runs on every PR and in the merge queue, so the gate sees the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      # V0-SYN-01 done-when: the xo-space and innernet manifests validate, with the kinds that
      # infra-config lists, read through qqcfg.load at a pinned infra-config commit.
      - uses: actions/checkout@v7
        with:
          repository: quirq-ai/infra-config
          ref: 87fef5f89104c91822068280f6949fa36d5eee0f  # TODO(expert): let rollers move this pin.
          path: .qq/infra-config
      - name: validate product manifests
        run: |
          kinds=$(python -c "import sys; from pathlib import Path; sys.path.insert(0, '.qq/infra-config/tools'); import qqcfg; print(' '.join('--kind=' + k['name'] for k in qqcfg.load(Path('.qq/infra-config'))['kinds']['kind']))")
          echo "kinds: $kinds"
          if [ -z "$kinds" ]; then echo "::error::infra-config listed no kinds"; exit 1; fi
          qqsync validate tests/fixtures/xo-space.repo.toml tests/fixtures/innernet.repo.toml $kinds
          qqsync pins --strict tests/fixtures/xo-space.repo.toml
          qqsync pins --strict tests/fixtures/innernet.repo.toml
      - name: "qqsync init: a new manifest validates (python-service + pytest, and node-app)"
        run: |
          d=$(mktemp -d)
          mkdir "$d/py" "$d/node"
          qqsync init "$d/py" --kind python-service --kind pytest --kinds .qq/infra-config/config/kinds.toml \
            --promoted tests/fixtures/promoted.toml --qq-version 0.1.0
          qqsync init "$d/node" --kind node-app --kinds .qq/infra-config/config/kinds.toml \
            --promoted tests/fixtures/promoted.toml --qq-version 0.1.0
          qqsync validate "$d/py/infra/repo.toml" --kind python-service --kind pytest
          qqsync validate "$d/node/infra/repo.toml" --kind node-app
          qqsync pins --strict "$d/py/infra/repo.toml"
          qqsync pins --strict "$d/node/infra/repo.toml"
          if qqsync init "$d/node" --kind node-app --kinds .qq/infra-config/config/kinds.toml \
            --promoted tests/fixtures/promoted.toml --qq-version 0.1.0; then
            echo "::error::init replaced an existing manifest"; exit 1
          fi
      - name: "V0-SYN-03 done-when: a fetched artifact that does not match its pin fails the build"
        run: |
          d=$(mktemp -d)
          printf 'tampered toolchain' > "$d/tc.tar"
          printf '%s\n' 'schema = "quirq-repo/1"' '[toolchains.tc]' "source = \"file://$d/tc.tar\"" \
            "digest = \"sha256:$(printf 'pinned toolchain' | sha256sum | cut -d' ' -f1)\"" \
            '[[targets]]' 'name = "a"' 'kind = "k"' > "$d/repo.toml"
          if qqsync fetch toolchains tc --dest "$d/out/tc.tar" --manifest "$d/repo.toml"; then
            echo "::error::a fetch that does not match its pin succeeded"; exit 1
          fi
          test ! -e "$d/out/tc.tar"
          printf 'pinned toolchain' > "$d/tc.tar"
          qqsync fetch toolchains tc --dest "$d/out/tc.tar" --manifest "$d/repo.toml"
      - name: no parser of repo.toml outside qqsync (this repo)
        run: qqsync guard . --allow 'src/qqsync/*' --allow tests/test_guard.py
      - name: "V0-SYN-04 done-when: a planted second parser fails presubmit"
        run: |
          d=$(mktemp -d)
          git clone -q . "$d/repo"
          # The planted parser is one of the samples in tests/test_guard.py, so this file stays clean.
          python -c "import sys; sys.path.insert(0, 'tests'); from test_guard import PLANTED; sys.stdout.write(PLANTED['scripts/pins.py'])" > "$d/repo/planted.py"
          git -C "$d/repo" add planted.py
          set +e
          qqsync guard "$d/repo" --allow 'src/qqsync/*' --allow tests/test_guard.py 2> "$d/err"
          code=$?
          set -e
          cat "$d/err"
          if [ "$code" -ne 1 ] || ! grep -qE '^planted.py:[0-9]+: parses repo.toml outside qqsync' "$d/err"; then
            echo "::error::the guard did not reject the planted parser (exit $code)"; exit 1
          fi
