# Hand-written until infra-config generates this repo's presubmit (V0-CFG-02).
# Runs on every PR and in the merge queue, so the gate sees the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      # V0-SYN-01 done-when: the xo-space and innernet manifests validate, with the kinds that
      # infra-config lists, read through qqcfg.load at a pinned infra-config commit.
      - uses: actions/checkout@v7
        with:
          repository: quirq-ai/infra-config
          ref: 87fef5f89104c91822068280f6949fa36d5eee0f  # TODO(expert): let rollers move this pin.
          path: .qq/infra-config
      - name: validate product manifests
        run: |
          kinds=$(python -c "import sys; from pathlib import Path; sys.path.insert(0, '.qq/infra-config/tools'); import qqcfg; print(' '.join('--kind=' + k['name'] for k in qqcfg.load(Path('.qq/infra-config'))['kinds']['kind']))")
          echo "kinds: $kinds"
          if [ -z "$kinds" ]; then echo "::error::infra-config listed no kinds"; exit 1; fi
          qqsync validate tests/fixtures/xo-space.repo.toml tests/fixtures/innernet.repo.toml $kinds
      - name: "V0-SYN-03 done-when: a fetched artifact that does not match its pin fails the build"
        run: |
          d=$(mktemp -d)
          printf 'tampered toolchain' > "$d/tc.tar"
          printf '%s\n' 'schema = "quirq-repo/1"' '[toolchains.tc]' "source = \"file://$d/tc.tar\"" \
            "digest = \"sha256:$(printf 'pinned toolchain' | sha256sum | cut -d' ' -f1)\"" \
            '[[targets]]' 'name = "a"' 'kind = "k"' > "$d/repo.toml"
          if qqsync fetch toolchains tc --dest "$d/out/tc.tar" --manifest "$d/repo.toml"; then
            echo "::error::a fetch that does not match its pin succeeded"; exit 1
          fi
          test ! -e "$d/out/tc.tar"
          printf 'pinned toolchain' > "$d/tc.tar"
          qqsync fetch toolchains tc --dest "$d/out/tc.tar" --manifest "$d/repo.toml"
